# Atelier Gate's catalog: the twelve Atelier apps, compiled in by build.rs (SUITE and DETAILS).
# Adapted from ArtCraft Launcher's catalog (storytold/craft-launcher, crates/core/catalog.toml),
# keeping its schema so upstream syncs merge: same app ids, colours, bundle ids and package names
# (machine names), with the Atelier names, the Nation's repos and publisher, and no macOS team
# (the Atelier apps are unsigned for now). `product` and `upstream_name` are Gate's own fields.
#
# Gate fetches no hosted catalog (`hosted_catalog::ENABLED` is false). The `icon_url`,
# `icon_sha256`, `desktop_categories` and `startup_wm_class` keys only keep upstream's hosted-catalog
# schema (and its tests) whole; `icon_sha256` is the hash of Gate's own icon in assets/app-icons.

